[project]
name = "simply-transcribe"
version = "0.2.0"
description = "Record audio and transcribe it to clipboard — local or cloud"
requires-python = ">=3.10"
dependencies = [
    "sounddevice>=0.5",
    "pyperclip>=1.9",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "pillow>=11.0",
]

[project.optional-dependencies]
openvino = [
    "openvino-genai",
    "librosa",
    "soundfile",
]
